[package]
name = "kapanis"
version = "1.0.0"
description = "Sakin ve düşük kaynak tüketimli Windows kapatma ve alarm zamanlayıcısı."
authors = ["kapanış."]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kapanis_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }
window-vibrancy = "0.6"
