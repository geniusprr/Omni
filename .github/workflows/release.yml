name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify bundled LibreChat client
        shell: pwsh
        run: |
          if (-not (Test-Path 'vendor/librechat-client/index.html')) {
            throw 'Bundled LibreChat client is missing from the release source.'
          }
      - name: Build NSIS installer
        run: npm run dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach updater artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          draft: false
          prerelease: false
          generate_release_notes: true
